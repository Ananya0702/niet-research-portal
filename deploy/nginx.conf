# NIET Research Portal — reverse proxy for single-VPS deployment.
# Serves the built React app and routes API paths to the backend containers.
#
#   /            -> static React build (SPA fallback to index.html)
#   /uploads/    -> main backend (faculty profile photos etc.)
#   /api/        -> main FastAPI backend      (container: backend:8000)
#   /otp/        -> Email OTP API             (container: otp-api:8001)
#   /mlsvc/      -> ML Classification API     (container: ml-api:8002)
#
# Trailing slashes on proxy_pass strip the location prefix, so the frontend
# can use relative base URLs (VITE_API_BASE_URL=/api) with zero code changes.

upstream niet_backend {
    server backend:8000;
}

upstream niet_otp {
    server otp-api:8001;
}

upstream niet_ml {
    server ml-api:8002;
}

server {
    listen 80;
    server_name _;

    # Bulk import uploads (xlsx/csv) can be large.
    client_max_body_size 25m;

    # Basic hardening
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Static React build ────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Service routes ────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://niet_backend/uploads/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://niet_backend/;
        include /etc/nginx/proxy_params.conf;
    }

    location /otp/ {
        proxy_pass http://niet_otp/;
        include /etc/nginx/proxy_params.conf;
    }

    location /mlsvc/ {
        proxy_pass http://niet_ml/;
        include /etc/nginx/proxy_params.conf;
    }
}
